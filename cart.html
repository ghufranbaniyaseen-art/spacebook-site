<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلتي | SPACEBOOK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="wrap nav">
    <a href="index.html" class="brand"><span class="dot"></span> SPACEBOOK</a>
    <nav class="nav-links">
      <a href="index.html#books">الكتب</a>
      <a href="index.html#help">مشاكل القراء</a>
      <a href="index.html#faq">الأسئلة الشائعة</a>
    </nav>
    <a href="cart.html" class="cart-btn">🛒 السلة <span class="cart-count">0</span></a>
  </div>
</header>

<main class="wrap">
  <h1 class="section-title" style="margin-top:26px">سلتي</h1>

  <div id="cartContent"></div>
</main>

<footer class="site">
  <div class="wrap">
    <div>SPACEBOOK — مكتبة صغيرة بحب كبير</div>
    <a href="https://instagram.com/space_books_03" target="_blank" rel="noopener">تابعينا على Instagram</a>
  </div>
</footer>

<script src="app.js"></script>
<script>
function renderCart() {
  const cart = getCart();
  const container = document.getElementById('cartContent');

  if (!cart.length) {
    container.innerHTML = `
      <div class="empty-state">
        <p>سلتك فاضية لهلأ</p>
        <a href="index.html#books">تصفحي كتبنا وابدئي طلبك</a>
      </div>`;
    return;
  }

  const { count, total, freeShipping } = cartTotals();

  const rows = cart.map(item => `
    <div class="cart-row">
      <div class="cart-thumb">${item.cover ? `<img src="${item.cover}">` : ''}</div>
      <div class="cart-info">
        <div class="t">${item.title}</div>
        <div class="p">${item.price} د.أ للنسخة</div>
      </div>
      <div class="qty-control">
        <button onclick="changeQty('${escapeAttr(item.title)}', ${item.qty - 1})">−</button>
        <span>${item.qty}</span>
        <button onclick="changeQty('${escapeAttr(item.title)}', ${item.qty + 1})">+</button>
      </div>
      <a class="remove-link" onclick="removeItem('${escapeAttr(item.title)}')">إزالة</a>
    </div>
  `).join('');

  const remaining = Math.max(0, 4 - count);

  container.innerHTML = `
    <div class="cart-checkout-layout">
      <div class="cart-list">${rows}</div>
      <div class="summary-box">
        <div class="summary-row"><span>عدد الكتب</span><span>${count}</span></div>
        <div class="summary-row total"><span>المجموع</span><span>${total} د.أ</span></div>
        <div class="free-ship-note ${freeShipping ? 'won' : ''}">
          ${freeShipping ? 'مبروك! طلبك مؤهل للتوصيل المجاني 🎉'.replace(' 🎉','') : `ضيفي ${remaining} كتاب ${remaining === 1 ? '' : 'كمان'} ليصير توصيلك مجاني`}
        </div>
        <a href="checkout.html" class="btn btn-primary btn-full">إتمام الطلب</a>
      </div>
    </div>
  `;
}

function changeQty(title, qty) {
  if (qty <= 0) { removeItem(title); return; }
  setQty(title, qty);
  renderCart();
}
function removeItem(title) {
  removeFromCart(title);
  renderCart();
}
function escapeAttr(str) {
  return String(str).replace(/'/g, "\\'");
}

renderCart();
</script>
</body>
</html>
