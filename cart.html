<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السلة | SPACEBOOKs</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="style.css?v=22">
</head>
<body>

<header class="site">
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <img src="assets/icon-192.png" alt="Space Books">
      <span class="brand-txt">
        <span class="brand-name">متجر <span class="mark">SPACEBOOKs</span> للكتب</span>
        <span class="brand-slogan" data-key="brand.slogan">اقرأ حتى السديم</span>
      </span>
    </a>
    <nav class="nav-links"><a href="index.html#books" data-key="nav.books">الكتب</a><a href="index.html#tools" data-key="nav.tools_alt">أدواتنا</a></nav>
    <a href="cart.html" class="cart-btn"><span data-key="nav.cart_label">السلة</span> <span class="cart-count">0</span></a>
  </div>
</header>

<main class="wrap">
  <h1 class="section-title" data-key="cart.page_title">سلة المشتريات</h1>
  <div id="cartBox"></div>
</main>

<script src="app.js?v=22"></script>
<script>
function renderCart(){
  const box=document.getElementById('cartBox');
  const cart=getCart();
  if(!cart.length){
    box.innerHTML=`<div class="empty">
      <div class="big">🛒</div>
      <p>${esc(T('cart.empty_msg','سلتك فاضية'))}</p>
      <a href="index.html#books" class="btn btn-cyan">${esc(T('cart.browse_button','تصفّح الكتب'))}</a>
    </div>`;
    return;
  }
  const {count,subtotal,shipping,total,freeShipping}=cartTotals();
  const need=Math.max(0,4-count);
  box.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start" id="cartLayout">
      <div>${cart.map(i=>`
        <div class="cart-item">
          <div class="thumb">${i.cover?`<img src="${escAttr(i.cover)}" alt="">`:'📖'}</div>
          <div class="info">
            <b>${esc(i.title)}</b>
            <span style="font-size:.86rem;color:var(--ink-soft)">${i.price} ${esc(T('cart.per_copy','د.أ للنسخة'))}</span>
          </div>
          <div class="qty">
            <button data-act="minus" data-t="${escAttr(i.title)}">−</button>
            <span>${i.qty}</span>
            <button data-act="plus" data-t="${escAttr(i.title)}">+</button>
          </div>
          <button class="trash" data-act="del" data-t="${escAttr(i.title)}" aria-label="حذف">🗑</button>
        </div>`).join('')}
      </div>
      <div class="summary">
        <div class="summary-row"><span>${esc(T('cart.count_label','عدد الكتب'))}</span><span>${count}</span></div>
        <div class="summary-row"><span>${esc(T('cart.subtotal_label','سعر الكتب'))}</span><span>${subtotal} د.أ</span></div>
        <div class="summary-row"><span>${esc(T('cart.shipping_label','التوصيل'))}</span><span>${shipping?shipping+' د.أ':esc(T('cart.free','مجاني'))}</span></div>
        <div class="summary-row total"><span>${esc(T('cart.total_label','المجموع'))}</span><span>${total} د.أ</span></div>
        <div class="ship-note ${freeShipping?'ship-ok':'ship-no'}">
          ${freeShipping?esc(T('cart.free_shipping_hit','مبروك! التوصيل مجاني لهاد الطلب')):`${esc(T('cart.free_shipping_hint_prefix','ضيف'))} ${need} ${need===1?esc(T('cart.book_singular','كتاب')):esc(T('cart.book_plural','كتب'))} ${esc(T('cart.free_shipping_hint_suffix','كمان وبتوفّر الديناران'))}`}
        </div>
        <a href="checkout.html" class="btn btn-cyan btn-full" style="margin-top:14px">${esc(T('cart.checkout_button','إتمام الطلب'))}</a>
        <a href="index.html#books" class="btn btn-outline btn-full" style="margin-top:9px">${esc(T('cart.continue_shopping','أكمل التسوق'))}</a>
      </div>
    </div>`;
  if(innerWidth<860) document.getElementById('cartLayout').style.gridTemplateColumns='1fr';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const t=b.dataset.t, cart=getCart(), it=cart.find(i=>i.title===t);
  if(b.dataset.act==='del') removeFromCart(t);
  else if(it) setQty(t, it.qty + (b.dataset.act==='plus'?1:-1));
  renderCart();
});
document.addEventListener('DOMContentLoaded',async ()=>{
  await window.textsReady;
  applyTexts();
  renderCart();
});
</script>
</body>
</html>
