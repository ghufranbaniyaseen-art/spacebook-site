<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الطلب | SPACEBOOKs</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="style.css?v=32">
</head>
<body>

<header class="site">
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <img src="assets/icon-192.png" alt="Space Books">
      <span class="brand-txt">
        <span class="brand-name">متجر <span class="mark">SPACEBOOKs</span> للكتب</span>
        <span class="brand-slogan" data-key="brand.slogan">اقرأ حتى السديم</span>
      </span>
    </a>
    <a href="cart.html" class="cart-btn"><span data-key="nav.cart_label">السلة</span> <span class="cart-count">0</span></a>
  </div>
</header>

<main class="wrap">
  <h1 class="section-title" data-key="checkout.page_title">إتمام الطلب</h1>
  <p class="section-sub" data-key="checkout.page_sub">الدفع عند الاستلام - ما في دفع مسبق</p>
  <div id="box"></div>
</main>

<script src="app.js?v=33"></script>
<script>
const GOVS=['عمّان','إربد','الزرقاء','البلقاء','المفرق','جرش','عجلون','مادبا','الكرك','الطفيلة','معان','العقبة'];

function render(){
  const box=document.getElementById('box');
  const cart=getCart();
  if(!cart.length){
    box.innerHTML=`<div class="empty"><div class="big">🛒</div><p>${esc(T('cart.empty_msg','سلتك فاضية'))}</p><a href="index.html#books" class="btn btn-cyan">${esc(T('cart.browse_button','تصفّح الكتب'))}</a></div>`;
    return;
  }
  const {count,subtotal,shipping,total,freeShipping}=cartTotals();
  box.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start" id="ckLayout">
      <form id="orderForm" style="background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px">
        <div class="field"><label>${esc(T('checkout.label_name','الاسم الكامل *'))}</label><input type="text" name="name" required></div>
        <div class="field"><label>${esc(T('checkout.label_phone','رقم التلفون *'))}</label><input type="tel" name="phone" id="phoneInput" required placeholder="07xxxxxxxx"></div>
        <div class="welcome-back hidden" id="lookupPanel"></div>
        <div class="field">
          <label>${esc(T('checkout.label_governorate','المحافظة *'))}</label>
          <select name="governorate" required>
            <option value="" disabled selected>${esc(T('checkout.governorate_ph','اختار المحافظة'))}</option>
            ${GOVS.map(g=>`<option>${g}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>${esc(T('checkout.label_area','المنطقة *'))}</label><input type="text" name="area" required placeholder="اسم المنطقة أو الحي"></div>
        <div class="field"><label>${esc(T('checkout.label_details','تفاصيل العنوان'))}</label><textarea name="details" placeholder="أقرب نقطة دالة، رقم البناية، الطابق"></textarea></div>
        <div class="field"><label>${esc(T('checkout.label_notes','ملاحظات (اختياري)'))}</label><textarea name="notes" placeholder="أي إشي بدك تضيفه على طلبك"></textarea></div>
        <div class="field"><label>${esc(T('checkout.label_alt_contact','وسيلة تواصل إضافية (اختياري)'))}</label><input type="text" name="altContact" placeholder="${escAttr(T('checkout.alt_contact_ph','انستغرام، واتساب، تيليجرام... إذا حابب'))}"></div>
        <label class="gift-toggle">
          <input type="checkbox" id="isGift">
          <span class="emoji">🎁</span>
          <span>${esc(T('checkout.gift_toggle_label','هاد الطلب هدية لحدا؟'))}</span>
        </label>
        <div class="gift-card hidden" id="giftCard">
          <label>${esc(T('checkout.gift_message_label','رسالة الإهداء'))}</label>
          <textarea name="giftMessage" id="giftMessage" maxlength="200" placeholder="${escAttr(T('checkout.gift_message_ph','مثلاً: كل عام وانت بخير يا سارة 🎉'))}"></textarea>
          <div class="gift-counter"><span id="giftCount">0</span>/200</div>
          <p class="gift-hint">✏️ ${esc(T('checkout.gift_hint','رح نكتبها إلك ببطاقة صغيرة ونحطها مع طلبك'))}</p>
        </div>
        <label class="check">
          <input type="checkbox" id="confirmContact" checked>
          <span>${esc(T('checkout.confirm_contact_label','تواصل معي لتأكيد الطلب'))}</span>
        </label>
        <input type="text" name="website" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" class="btn btn-cyan btn-full" id="sendBtn">${esc(T('checkout.submit_button','تأكيد الطلب'))}</button>
        <div class="form-msg" id="msg"></div>
      </form>
      <div class="summary">
        <div class="block-title" style="margin-top:0">${esc(T('checkout.summary_title','ملخص الطلب'))}</div>
        ${cart.map(i=>`<div class="summary-row"><span>${esc(i.title)} × ${i.qty}</span><span>${Math.round(i.price*i.qty*100)/100} د.أ</span></div>`).join('')}
        <div class="summary-row"><span>${esc(T('cart.subtotal_label','سعر الكتب'))}</span><span>${subtotal} د.أ</span></div>
        <div class="summary-row"><span>${esc(T('cart.shipping_label','التوصيل'))}</span><span>${shipping?shipping+' د.أ':esc(T('cart.free','مجاني'))}</span></div>
        <div class="summary-row total"><span>${esc(T('checkout.grand_total_label','الإجمالي'))}</span><span>${total} د.أ</span></div>
        <div class="ship-note ${freeShipping?'ship-ok':'ship-no'}">
          ${freeShipping?esc(T('checkout.free_shipping_hit','التوصيل مجاني لهاد الطلب')):esc(T('checkout.shipping_hint','رسوم التوصيل ديناران، وبتصير مجانية من 4 كتب'))}
        </div>
      </div>
    </div>`;
  if(innerWidth<860) document.getElementById('ckLayout').style.gridTemplateColumns='1fr';

  const phoneInput=document.getElementById('phoneInput'), lookupPanel=document.getElementById('lookupPanel');
  let lookupTimer, lastLookupDigits='';
  phoneInput.addEventListener('input',()=>{
    clearTimeout(lookupTimer);
    const digits=phoneInput.value.replace(/[^0-9]/g,'');
    if(digits.length<9){ lookupPanel.classList.add('hidden'); lastLookupDigits=''; return; }
    lookupTimer=setTimeout(()=>doLookup(digits),700);
  });
  async function doLookup(digits){
    if(digits===lastLookupDigits) return;
    lastLookupDigits=digits;
    try{
      const res=await fetch('/api/lookup?phone='+encodeURIComponent(digits));
      if(!res.ok) throw new Error('lookup '+res.status);
      const data=await res.json();
      if(digits!==lastLookupDigits) return;
      if(!data.found){ lookupPanel.classList.add('hidden'); lookupPanel.innerHTML=''; return; }
      const sugg=(data.suggestions||[]).slice(0,3);
      const orderWord = data.orderCount===1 ? T('checkout.order_singular','مرة') : T('checkout.order_plural','مرات');
      lookupPanel.innerHTML=`
        <b>👋 ${esc(T('checkout.welcome_back_title','أهلين فيك رجعت!'))}</b>
        <span>${esc(T('checkout.welcome_back_count_prefix','طلبت عنا'))} ${data.orderCount} ${esc(orderWord)} ${esc(T('checkout.welcome_back_count_suffix','من قبل 🎉'))}</span>
        ${sugg.length?`<div class="welcome-suggest-label">${esc(T('checkout.welcome_suggest_label','بما إنك حبيت هالكتاب، جرب:'))}</div>
        <div class="welcome-suggest-list">${sugg.map(b=>`
          <div class="welcome-book">
            ${b.cover?`<img src="${escAttr(b.cover)}" alt="">`:'📖'}
            <div class="welcome-book-info"><b>${esc(b.title)}</b><span>${b.price} د.أ</span></div>
          </div>`).join('')}</div>`:''}`;
      lookupPanel.classList.remove('hidden');
    }catch(e){ /* صامت - ما لازم يعطل تجربة الطلب */ }
  }

  const giftChk=document.getElementById('isGift'), giftCard=document.getElementById('giftCard'), giftMsg=document.getElementById('giftMessage');
  giftChk.addEventListener('change',()=>{
    giftCard.classList.toggle('hidden',!giftChk.checked);
    if(giftChk.checked) giftMsg.focus();
  });
  giftMsg.addEventListener('input',()=>{
    document.getElementById('giftCount').textContent=giftMsg.value.length;
  });

  document.getElementById('orderForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const fd=new FormData(e.target), msg=document.getElementById('msg'), btn=document.getElementById('sendBtn');
    const confirmContact=document.getElementById('confirmContact').checked;
    const isGift=giftChk.checked;
    msg.textContent=T('checkout.sending','جاري إرسال الطلب...'); msg.className='form-msg'; btn.disabled=true;
    try{
      const r=await postToSheet({
        type:'order',
        name:fd.get('name'), phone:fd.get('phone'),
        governorate:fd.get('governorate'), area:fd.get('area'),
        locationDetails:fd.get('details')||'',
        notes:fd.get('notes')||'',
        altContact:fd.get('altContact')||'',
        confirmContact: confirmContact?'نعم':'لا',
        isGift: isGift?'نعم':'لا',
        giftMessage: isGift?(fd.get('giftMessage')||''):'',
        books:cart.map(i=>`${i.title} ×${i.qty}`).join(' | '),
        count, subtotal, shipping, total,
        hp:fd.get('website')||'',
      });
      localStorage.removeItem('spacebooks_cart');
      const successBody = confirmContact
        ? T('checkout.success_body','بنتواصل معك على الرقم اللي كتبته لتأكيد الطلب وموعد التوصيل.')
        : T('checkout.success_body_no_confirm','تمام! جهزنالك طلبك عالعنوان يلي حددته بدون ما نتصل فيك للتأكيد.');
      const giftNote = isGift ? `<p class="gift-hint" style="justify-content:center">🎁 ${esc(T('checkout.success_gift_note','هدية حلوة! رح نجهزلها بطاقة إهداء ونحطها مع طلبك.'))}</p>` : '';
      document.getElementById('box').innerHTML=`
        <div class="empty">
          <div class="big">✅</div>
          <h2 style="color:var(--navy);margin:0 0 6px">${esc(T('checkout.success_title','وصلنا طلبك'))}</h2>
          ${r&&r.orderNumber?`<p>${esc(T('checkout.order_number_label','رقم طلبك:'))} <b>#${r.orderNumber}</b></p>`:''}
          <p>${esc(successBody)}</p>
          ${giftNote}
          <a href="index.html" class="btn btn-cyan">${esc(T('checkout.back_home_button','رجوع للمكتبة'))}</a>
        </div>`;
      updateBadge();
    }catch(err){
      msg.textContent=T('checkout.error','صار في خطأ بالإرسال، حاول كمان مرة'); msg.className='form-msg err'; btn.disabled=false;
    }
  });
}
document.addEventListener('DOMContentLoaded',async ()=>{
  await window.textsReady;
  applyTexts();
  render();
});
</script>
</body>
</html>
