<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الطلب | SPACEBOOKs</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="style.css?v=18">
</head>
<body>

<header class="site">
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <img src="assets/icon-192.png" alt="Space Books">
      <span class="brand-txt">
        <span class="brand-name">متجر <span class="mark">SPACEBOOKs</span> للكتب</span>
        <span class="brand-slogan">اقرأ حتى السديم</span>
      </span>
    </a>
    <a href="cart.html" class="cart-btn">السلة <span class="cart-count">0</span></a>
  </div>
</header>

<main class="wrap">
  <h1 class="section-title">إتمام الطلب</h1>
  <p class="section-sub">الدفع عند الاستلام - ما في دفع مسبق</p>
  <div id="box"></div>
</main>

<script src="app.js?v=18"></script>
<script>
const GOVS=['عمّان','إربد','الزرقاء','البلقاء','المفرق','جرش','عجلون','مادبا','الكرك','الطفيلة','معان','العقبة'];

function render(){
  const box=document.getElementById('box');
  const cart=getCart();
  if(!cart.length){
    box.innerHTML=`<div class="empty"><div class="big">🛒</div><p>سلتك فاضية</p><a href="index.html#books" class="btn btn-cyan">تصفّح الكتب</a></div>`;
    return;
  }
  const {count,subtotal,shipping,total,freeShipping}=cartTotals();
  box.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start" id="ckLayout">
      <form id="orderForm" style="background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px">
        <div class="field"><label>الاسم الكامل *</label><input type="text" name="name" required></div>
        <div class="field"><label>رقم التلفون *</label><input type="tel" name="phone" required placeholder="07xxxxxxxx"></div>
        <div class="field">
          <label>المحافظة *</label>
          <select name="governorate" required>
            <option value="" disabled selected>اختار المحافظة</option>
            ${GOVS.map(g=>`<option>${g}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>المنطقة *</label><input type="text" name="area" required placeholder="اسم المنطقة أو الحي"></div>
        <div class="field"><label>تفاصيل العنوان</label><textarea name="details" placeholder="أقرب نقطة دالة، رقم البناية، الطابق"></textarea></div>
        <div class="field"><label>ملاحظات (اختياري)</label><textarea name="notes" placeholder="أي إشي بدك تضيفه على طلبك"></textarea></div>
        <button type="submit" class="btn btn-cyan btn-full" id="sendBtn">تأكيد الطلب</button>
        <div class="form-msg" id="msg"></div>
      </form>
      <div class="summary">
        <div class="block-title" style="margin-top:0">ملخص الطلب</div>
        ${cart.map(i=>`<div class="summary-row"><span>${esc(i.title)} × ${i.qty}</span><span>${Math.round(i.price*i.qty*100)/100} د.أ</span></div>`).join('')}
        <div class="summary-row"><span>سعر الكتب</span><span>${subtotal} د.أ</span></div>
        <div class="summary-row"><span>التوصيل</span><span>${shipping?shipping+' د.أ':'مجاني'}</span></div>
        <div class="summary-row total"><span>الإجمالي</span><span>${total} د.أ</span></div>
        <div class="ship-note ${freeShipping?'ship-ok':'ship-no'}">
          ${freeShipping?'التوصيل مجاني لهاد الطلب':'رسوم التوصيل ديناران، وبتصير مجانية من 4 كتب'}
        </div>
      </div>
    </div>`;
  if(innerWidth<860) document.getElementById('ckLayout').style.gridTemplateColumns='1fr';

  document.getElementById('orderForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const fd=new FormData(e.target), msg=document.getElementById('msg'), btn=document.getElementById('sendBtn');
    msg.textContent='جاري إرسال الطلب...'; msg.className='form-msg'; btn.disabled=true;
    try{
      const r=await postToSheet({
        type:'order',
        name:fd.get('name'), phone:fd.get('phone'),
        governorate:fd.get('governorate'), area:fd.get('area'),
        locationDetails:fd.get('details')||'',
        notes:fd.get('notes')||'',
        books:cart.map(i=>`${i.title} ×${i.qty}`).join(' | '),
        count, subtotal, shipping, total,
      });
      localStorage.removeItem('spacebooks_cart');
      document.getElementById('box').innerHTML=`
        <div class="empty">
          <div class="big">✅</div>
          <h2 style="color:var(--navy);margin:0 0 6px">وصلنا طلبك</h2>
          ${r&&r.orderNumber?`<p>رقم طلبك: <b>#${r.orderNumber}</b></p>`:''}
          <p>بنتواصل معك على الرقم اللي كتبته لتأكيد الطلب وموعد التوصيل.</p>
          <a href="index.html" class="btn btn-cyan">رجوع للمكتبة</a>
        </div>`;
      updateBadge();
    }catch(err){
      msg.textContent='صار في خطأ بالإرسال، حاول كمان مرة'; msg.className='form-msg err'; btn.disabled=false;
    }
  });
}
document.addEventListener('DOMContentLoaded',render);
</script>
</body>
</html>
